framework:
    messenger:
        failure_transport: failed

        transports:
            async_priority:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_priority'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 30000
                    jitter: 0.1
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 30000
                    jitter: 0.1
            failed: 'doctrine://default?queue_name=failed&auto_setup=1'

        routing:
            App\Candidate\Application\Message\ProcessCvMessage: async_priority
            App\Job\Message\ImportJobSourceMessage: async_priority
            App\Job\Message\RefreshJobSourcesMessage: async
            App\Matching\Message\AnalyzeJobMatchMessage: async

when@test:
    framework:
        messenger:
            failure_transport: failed
            transports:
                async_priority: 'in-memory://'
                async: 'in-memory://'
                failed: 'in-memory://'
