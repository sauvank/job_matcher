# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.cv_storage_directory: '%kernel.project_dir%/var/cv'
    app.hellowork.max_offers: 10
    app.matching.weights:
        stack: 35
        experience: 15
        salary: 15
        location: 10
        contract: 10
        backend: 10
        remote: 5

services:
    _instanceof:
        App\Job\Provider\JobProviderInterface:
            tags: ['app.job_provider']

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Candidate\Application\Storage\CvStorageInterface:
        alias: App\Candidate\Infrastructure\Storage\LocalPrivateCvStorage

    App\Candidate\Application\Extraction\CvTextExtractorInterface:
        alias: App\Candidate\Infrastructure\Extraction\LocalCvTextExtractor

    App\Candidate\Application\Analyzer\CvAnalyzerInterface:
        alias: App\Candidate\Infrastructure\Analyzer\ConfiguredCvAnalyzer

    App\Candidate\Application\Repository\CvDocumentRepositoryInterface:
        alias: App\Candidate\Infrastructure\Persistence\CvDocumentRepository

    App\Candidate\Application\Repository\CandidateProfileRepositoryInterface:
        alias: App\Candidate\Infrastructure\Persistence\CandidateProfileRepository

    App\Job\Application\Repository\JobSourceRepositoryInterface:
        alias: App\Job\Repository\JobSourceRepository

    App\Job\Application\Repository\JobOfferRepositoryInterface:
        alias: App\Job\Repository\JobOfferRepository

    App\Matching\Application\Repository\JobMatchRepositoryInterface:
        alias: App\Matching\Repository\JobMatchRepository

    App\Matching\Application\Analyzer\JobSemanticAnalyzerInterface:
        alias: App\Matching\Infrastructure\Analyzer\ConfiguredJobSemanticAnalyzer

    App\Candidate\Infrastructure\Storage\LocalPrivateCvStorage:
        arguments:
            $storageDirectory: '%app.cv_storage_directory%'

    App\Candidate\Infrastructure\Analyzer\ConfiguredCvAnalyzer:
        arguments:
            $mode: '%env(CV_ANALYZER)%'

    App\Candidate\Infrastructure\Analyzer\OpenAiCvAnalyzer:
        arguments:
            $apiKey: '%env(OPENAI_API_KEY)%'
            $model: '%env(OPENAI_MODEL)%'

    App\Matching\Infrastructure\Analyzer\ConfiguredJobSemanticAnalyzer:
        arguments:
            $mode: '%env(CV_ANALYZER)%'

    App\Matching\Infrastructure\Analyzer\OpenAiJobSemanticAnalyzer:
        arguments:
            $apiKey: '%env(OPENAI_API_KEY)%'
            $model: '%env(JOB_OPENAI_MODEL)%'

    App\Job\Provider\JobProviderRegistry:
        arguments:
            $providers: !tagged_iterator app.job_provider

    App\Job\Provider\HelloWorkJobProvider:
        arguments:
            $maxOffers: '%app.hellowork.max_offers%'

    App\Matching\Service\DeterministicJobScorer:
        arguments:
            $weights: '%app.matching.weights%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
