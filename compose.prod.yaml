name: job-matcher-prod

services:
  php:
    image: ${PHP_IMAGE:-job-matcher-php:prod}
    build:
      context: .
      target: php_prod
    env_file:
      - ${PROD_ENV_FILE:-.env.prod.local}
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
    volumes:
      - cv_data:/app/var/cv
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:-job-matcher-nginx:prod}
    build:
      context: .
      target: nginx_prod
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8081}:80"
    depends_on:
      - php
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    image: ${PHP_IMAGE:-job-matcher-php:prod}
    env_file:
      - ${PROD_ENV_FILE:-.env.prod.local}
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      CLAMAV_DSN: tcp://clamav:3310
      CV_EXTRACTOR_DSN: unix:///run/cv-extractor/extractor.sock
    command: php bin/console messenger:consume async scheduler_job_sync --time-limit=3600 --memory-limit=128M --no-interaction
    volumes:
      - cv_data:/app/var/cv
      - extractor_runtime:/run/cv-extractor:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      extractor:
        condition: service_healthy
    restart: unless-stopped

  extractor:
    image: ${PHP_IMAGE:-job-matcher-php:prod}
    command: php bin/cv-extractor-server.php
    user: "82:82"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - cv_data:/app/var/cv:ro
      - extractor_runtime:/run/cv-extractor
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_exists('/run/cv-extractor/extractor.sock') ? 0 : 1);"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  clamav:
    image: clamav/clamav-debian:1.4
    environment:
      CLAMD_CONF_StreamMaxLength: 11M
      CLAMD_CONF_MaxFileSize: 11M
      CLAMD_CONF_MaxScanSize: 50M
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      FRESHCLAM_CHECKS: 2
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 600s
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav

  database:
    image: postgres:16-alpine
    env_file:
      - ${PROD_ENV_FILE:-.env.prod.local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  clamav_data:
  cv_data:
  database_data:
  extractor_runtime:
  redis_data:
