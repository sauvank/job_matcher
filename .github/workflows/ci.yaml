name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Tests et qualité
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build application image
        run: docker compose build php
      - name: Validate Composer metadata
        run: docker compose run --rm php composer validate --strict
      - name: Run unit, functional and quality checks
        run: make qa
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test services
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish ${{ matrix.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PHP
            image: ghcr.io/sauvank/job-matcher-php
            target: php_prod
            cache-scope: production-php
          - name: nginx
            image: ghcr.io/sauvank/job-matcher-nginx
            target: nginx_prod
            cache-scope: production-nginx
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Job Matcher ${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

  deploy:
    name: Deploy production
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_PORT: ${{ secrets.VPS_PORT }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      DEPLOY_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure production SSH identity
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/job-matcher-production"
          chmod 600 "$HOME/.ssh/job-matcher-production"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer deployment files
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          package="$RUNNER_TEMP/job-matcher-deployment-$DEPLOY_SHA.tar.gz"
          tar -czf "$package" compose.prod.yaml scripts/deploy-production.sh
          ssh \
            -i "$HOME/.ssh/job-matcher-production" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" "$DEPLOY_SHA" <<'REMOTE'
          set -Eeuo pipefail
          mkdir -p "$1/.deploy/releases/$2"
          chmod 700 "$1/.deploy" "$1/.deploy/releases"
          REMOTE
          scp \
            -i "$HOME/.ssh/job-matcher-production" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_PORT" \
            "$package" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.deploy/releases/$DEPLOY_SHA/deployment.tar.gz"

      - name: Deploy immutable revision
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i "$HOME/.ssh/job-matcher-production" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" "$DEPLOY_SHA" <<'REMOTE'
          set -Eeuo pipefail
          release_dir="$1/.deploy/releases/$2"
          tar -xzf "$release_dir/deployment.tar.gz" -C "$release_dir"
          DEPLOY_PROJECT_DIR="$1" \
            "$release_dir/scripts/deploy-production.sh" "$2" "$release_dir/compose.prod.yaml"
          REMOTE
