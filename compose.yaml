name: job-matcher

services:
  php:
    image: job-matcher-php:dev
    build:
      context: .
    environment:
      APP_ENV: dev
      APP_SECRET: local-development-secret
      DATABASE_URL: postgresql://app:app@database:5432/job_matcher?serverVersion=16&charset=utf8
      LOCK_DSN: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
    volumes:
      - ./:/app
      - vendor_data:/app/vendor
      - assets_vendor_data:/app/assets/vendor
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  worker:
    image: job-matcher-php:dev
    build:
      context: .
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --no-interaction
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_SECRET: local-development-secret
      DATABASE_URL: postgresql://app:app@database:5432/job_matcher?serverVersion=16&charset=utf8
      LOCK_DSN: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
    volumes:
      - ./:/app
      - vendor_data:/app/vendor
      - assets_vendor_data:/app/assets/vendor
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_matcher
      POSTGRES_PASSWORD: app
      POSTGRES_USER: app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d job_matcher"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  database_data:
  redis_data:
  vendor_data:
  assets_vendor_data:
